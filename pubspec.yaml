name: wildwood_trail
description: A native forest exploration game with timed wildlife decisions.
publish_to: none
version: 2.0.0+2
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoDevanagari.ttf
